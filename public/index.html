<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Person Monitor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: #f5f7fa;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 42px;
    }
    .subtitle {
      color: #9da7b5;
      margin-bottom: 32px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #2a303b;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #888;
    }
    .dot.ok {
      background: #3ddc84;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      background: #141821;
      border: 1px solid #252b36;
      border-radius: 16px;
      padding: 24px;
    }
    .label {
      color: #9da7b5;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .value {
      font-size: 36px;
      font-weight: 700;
    }
    .error {
      color: #ff7b7b;
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Person Monitor</h1>
    <div class="subtitle">Портал моніторингу відкритих джерел</div>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="status">Перевірка сервісу...</span>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Суб’єкти</div>
        <div id="subjects" class="value">-</div>
      </div>

      <div class="card">
        <div class="label">Згадки</div>
        <div id="mentions" class="value">-</div>
      </div>
    </div>

    <section style="margin-top: 32px;">
      <h2>Суб’єкти моніторингу</h2>
      <div id="subjects-list"></div>
    </section>

    <section id="subject-stats-section" style="margin-top: 32px; display: none;">
      <h2 id="subject-stats-title">Огляд суб’єкта</h2>

      <div class="grid">
        <div class="card">
          <div class="label">Остання перевірка</div>
          <div id="subject-last-checked" style="font-size: 18px; font-weight: 700;">-</div>
        </div>

        <div class="card">
          <div class="label">Перевірено кандидатів</div>
          <div id="subject-scanned" class="value">-</div>
        </div>

        <div class="card">
          <div class="label">Поріг збігу</div>
          <div id="subject-threshold" class="value">-</div>
        </div>

        <div class="card">
          <div class="label">Підтверджені згадки</div>
          <div id="subject-confirmed" class="value">-</div>
        </div>
      </div>

      <div class="card" style="margin-top: 16px;">
        <div class="label">Розподіл згадок за джерелами</div>
        <div id="subject-provider-stats">Завантаження...</div>
      </div>
    </section>

    <section id="mentions-section" style="margin-top: 32px; display: none;">
      <h2 id="mentions-title">Згадки</h2>

      <a
        id="excel-report"
        href="#"
        style="display: none; margin-bottom: 16px; width: fit-content; padding: 11px 16px; border: 1px solid #2a303b; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 700;"
      >
        📊 Завантажити Excel-звіт
      </a>

      <div class="card" style="margin-bottom: 16px; padding: 16px;">
        <input
          id="mentions-search"
          type="search"
          placeholder="Пошук серед згадок..."
          style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #2a303b; background: #0b0d12; color: inherit;"
        >

        <select
          id="mentions-provider"
          style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #2a303b; background: #0b0d12; color: inherit;"
        >
          <option value="">Усі джерела</option>
        </select>

        <select
          id="mentions-sort"
          style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a303b; background: #0b0d12; color: inherit;"
        >
          <option value="newest">Новіші спочатку</option>
          <option value="oldest">Старіші спочатку</option>
          <option value="score">Найвищий збіг</option>
        </select>

        <div id="mentions-count" class="label" style="margin-top: 12px;"></div>
      </div>

      <div id="mentions-list"></div>

      <button
        id="mentions-more"
        type="button"
        style="display: none; width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px; border: 1px solid #2a303b; background: #141821; color: inherit; font-weight: 700; cursor: pointer;"
      >
        Показати ще
      </button>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
